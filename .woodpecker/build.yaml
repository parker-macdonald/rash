when:
  - event: push

matrix:
  COMPILER:
    - gcc:latest
    - gcc:15
    - gcc:14
    - silkeh/clang:latest
    - silkeh/clang:22
    - silkeh/clang:21
    - silkeh/clang:20

steps:
  - name: build
    image: ${COMPILER}
    commands:
      - make CC=cc DEBUG=0
  - name: test
    image: ${COMPILER}
    commands:
      - make test CC=cc DEBUG=0